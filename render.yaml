# Render.com 배포 설정 (사이트만. 채점은 선생님 PC)
services:
  - type: web
    name: math-site
    runtime: python
    plan: free
    region: singapore
    rootDir: math-site
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    envVars:
      - key: DATABASE_URL        # Neon 등 무료 Postgres 주소
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GRADER_TOKEN        # 채점 PC config.env 에도 같은 값
        generateValue: true
      - key: BASE_URL            # 예: https://math-site.onrender.com
        sync: false
      - key: TEACHER_PASSWORD    # 선생님 로그인 비밀번호
        sync: false
      - key: ACCESS_KEY          # 디스코드에 올릴 링크: https://<주소>/join/<이 값>
        generateValue: true
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_KEY_ID
        sync: false
      - key: S3_SECRET
        sync: false
