{% extends "base.html" %}
{% block body %}
<p><a href="/t/import">← 등록 목록</a></p>
<h2>{{ j.title }} <span class="muted">{{ SUBJECTS[j.subject or 'math'] }} {{ j.grade }}</span></h2>
<section class="stats">
  <a class="stat" href="/t/problems?job={{ j.id }}"><span>등록된 문제</span><b>{{ n }}</b></a>
  <a class="stat {{ 'warn' if nc }}" href="/t/problems?job={{ j.id }}&check=1"><span>확인 필요</span><b>{{ nc }}</b></a>
</section>
<section class="card"><h3>보고서</h3><div class="feedback">{{ j.report or '아직 없어요 (처리 중이거나 대기 중)' }}</div></section>
<section class="card"><h3>처리 기록</h3><div class="feedback small">{{ j.log }}</div></section>
{% endblock %}
