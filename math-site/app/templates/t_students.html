{% extends "base.html" %}
{% block body %}
<h2>학생 관리</h2>
<section class="card"><h3>학생 추가</h3>
<p class="muted">학생은 여기 등록한 이름 그대로 입력해서 들어와요.</p>
<form method="post" action="/t/students/add" class="row">
<input name="name" required placeholder="이름 (예: 김지아)">
<select name="grade">{% for g in STUDENT_GRADES %}<option>{{ g }}</option>{% endfor %}</select>
<button class="btn">추가</button></form></section>
<section class="card"><table>
<tr><th>이름 / 학년 / 상태</th><th class="r">적립금</th><th></th></tr>
{% for x in users %}<tr class="{{ '' if x.active else 'muted' }}">
<td><form method="post" action="/t/students/{{ x.id }}" class="row">
<input name="name" value="{{ x.name }}" style="width:8em">
<select name="grade"><option value="">학년 미정</option>{% for g in STUDENT_GRADES %}<option {{ 'selected' if x.grade==g }}>{{ g }}</option>{% endfor %}</select>
<select name="active"><option value="1" {{ 'selected' if x.active }}>활동</option><option value="0" {{ 'selected' if not x.active }}>중지</option></select>
<button class="btn small">저장</button></form></td>
<td class="r">{{ "{:,}".format(bal[x.id]) }}원</td><td><a href="/t/student/{{ x.id }}">상세</a></td></tr>
{% else %}<tr><td colspan="3" class="muted">아직 학생이 없어요. 위에서 추가하세요.</td></tr>{% endfor %}
</table></section>
{% endblock %}
