{% extends "base.html" %}
{% block body %}
<div class="center card">
  <h1>∑ 수학 적립</h1>
  {% if msg %}<p class="alert">{{ msg }}</p>{% endif %}
  {% if access %}
  <form method="post" action="/login" class="stack">
    <label>내 이름 <input name="name" required autofocus autocomplete="username" placeholder="예: 김지아"></label>
    <button class="btn big">들어가기</button>
  </form>
  {% else %}
  <p>디스코드에 올라온 링크로 들어와 주세요.</p>
  {% endif %}
  <details style="margin-top:24px"><summary class="muted">선생님</summary>
    <form method="post" action="/teacher-login" class="stack">
      <input type="password" name="password" placeholder="비밀번호" required>
      <button class="btn">선생님으로 들어가기</button>
    </form></details>
</div>
{% endblock %}
